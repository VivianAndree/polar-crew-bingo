<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polar Crew Bingo</title><style>:root{font-family:system-ui,sans-serif;color:#47365e;background:#f7efff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:730px;margin:auto;text-align:center}h1{margin:8px 0;color:#75519c}p{margin:8px 0 20px}.bear{font-size:3rem}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.cell{border:2px solid #d8bfe8;border-radius:12px;background:#fffdfd;color:#50385e;min-height:105px;padding:7px 4px;font:600 clamp(10px,1.8vw,15px)/1.25 system-ui;cursor:pointer;overflow-wrap:anywhere}.cell.marked{background:#c7a5e7;border-color:#8459af;color:#321d49}.cell.win{background:#ffe3a1;border-color:#e6aa41}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}button.action{background:#7953a2;color:white;border:0;border-radius:24px;padding:12px 18px;font-weight:700;cursor:pointer}#status{font-weight:700;min-height:30px;color:#7650a3}@media(max-width:520px){body{padding:10px}.board{gap:4px}.cell{min-height:82px;border-radius:8px;padding:3px;font-size:clamp(9px,2.35vw,12px)}}@media(prefers-reduced-motion:no-preference){.cell{transition:background .15s,transform .15s}.cell:active{transform:scale(.96)}}</style></head><body><main><div class="bear">🐻‍❄️💜</div><h1>POLAR CREW BINGO</h1><p>👻 Resident Evil Village Edition · Tippe auf ein Feld, wenn es passiert!</p><div class="board" id="board" aria-label="Bingo-Karte"></div><div class="buttons"><button class="action" id="new">🎲 Neue Karte</button><button class="action" id="reset">↩ Markierungen löschen</button></div><div id="status" role="status" aria-live="polite"></div><small>5 in einer Reihe – waagerecht, senkrecht oder diagonal – ergeben BINGO! ✨</small></main><script>const items=['Juma erschrickt 😱','Wir verlaufen uns 🗺️','Ein Gegner überrascht uns 👀','Juma schreit 😂','Chat sagt: Lauf! 🏃','Inventar ist voll 🎒','Ein Rätsel dauert ewig 🧩','Wir finden Loot 💎','Juma schimpft mit einem NPC 💬','Gruselige Geräusche 👂','Ein Heilitem wird gebraucht 🧪','Juma traut sich nicht weiter 🙈','Ein Boss erscheint 💀','Chat lacht 😂','Wir finden einen Schlüssel 🗝️','Juma erschrickt zweimal 😱','Eine Tür ist verschlossen 🚪','Wir müssen fliehen 🏃','Ein Gegner wird übersehen 👻','Juma sagt: Oh nein! 😭','Wir finden ein Geheimnis 🔍','Eine Cutscene beginnt 🎬','Juma lädt mitten im Kampf nach 🔫','Juma übersieht etwas direkt vor ihrer Nase 🔎'];let order=[],marked=new Set([12]);const board=document.getElementById('board'),status=document.getElementById('status');function make(){order=[...items];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}order.splice(12,0,'💜 FREIFELD 💜');marked=new Set([12]);draw()}function draw(){board.replaceChildren();let winning=[];for(let r=0;r<5;r++){winning.push([0,1,2,3,4].map(c=>r*5+c));winning.push([0,1,2,3,4].map(c=>c*5+r))}winning.push([0,6,12,18,24],[4,8,12,16,20]);const wins=winning.filter(line=>line.every(i=>marked.has(i)));const winCells=new Set(wins.flat());order.forEach((s,i)=>{let b=document.createElement('button');b.className='cell'+(marked.has(i)?' marked':'')+(winCells.has(i)?' win':'');b.textContent=s;b.setAttribute('aria-pressed',marked.has(i));b.onclick=()=>{if(i!==12){marked.has(i)?marked.delete(i):marked.add(i);draw()}};board.append(b)});status.textContent=wins.length?'🎉 BINGO! Die Polar Crew hat gewonnen! 🐻‍❄️💜':''}document.getElementById('new').onclick=make;document.getElementById('reset').onclick=()=>{marked=new Set([12]);draw()};make();</script></body></html>
